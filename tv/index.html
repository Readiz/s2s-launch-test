<!doctype html>
<html lang="ko">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>게임 실행</title><link rel="icon" href="icon.png">
<style>
body{margin:0;background:#080e19;color:#f4f6fc;font-family:"Segoe UI","Malgun Gothic",sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center}main{text-align:center;padding:24px;max-width:85vw}img{width:117px;height:117px;border-radius:20px;border:1px solid #ffffff30;margin-bottom:24px}h1{font-size:clamp(32px,4vw,60px);margin:0 0 16px}p{font-size:17px;color:#9dafc8;overflow-wrap:anywhere}.line{width:180px;height:3px;margin:24px auto;background:#ffffff15;overflow:hidden}.line span{display:block;height:100%;width:40%;background:#9ec9ff;animation:travel 1.2s ease-in-out infinite}@keyframes travel{from{transform:translateX(-100%)}to{transform:translateX(350%)}}@media(prefers-reduced-motion:reduce){.line span{animation:none;width:100%}}
</style></head>
<body><main><img src="icon.png" alt=""><h1 id="name">게임 실행</h1><p id="status">콘솔에서 게임을 여는 중…</p><div class="line" aria-hidden="true"><span></span></div></main><script src="config.js"></script><script src="hdmi.js"></script><script src="launcher.js"></script></body>
</html>
